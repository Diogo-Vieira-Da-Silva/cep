 <!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css">
    <title>CEP</title>
  </head>
  <body>
    <h1>CEP</h1>
    <input id="CEP" type="text" placeholder="CEP">
    <button onclick="carregaCEP()" id="pesquisar">Digite o CEP</button>

    <!-- resultados com rótulos (labels) -->
    <div class="result">
      <div class="result-label" id="labelBairro" aria-hidden="true">Bairro</div>
      <p id="Bairro" class="result-value"></p>
    </div>

    <div class="result">
      <div class="result-label" id="labelCidade" aria-hidden="true">Cidade</div>
      <p id="Cidade" class="result-value"></p>
    </div>

    <div class="result">
      <div class="result-label" id="labelEstado" aria-hidden="true">Estado</div>
      <p id="Estado" class="result-value"></p>
    </div>

    <!-- novos campos -->
    <div class="result">
      <div class="result-label" id="labelRegiao" aria-hidden="true">Região</div>
      <p id="Regiao" class="result-value"></p>
    </div>

    <div class="result">
      <div class="result-label" id="labelComplemento" aria-hidden="true">Complemento</div>
      <p id="Complemento" class="result-value"></p>
    </div>


    <script src="script.js"></script>
  </body>
</html>
